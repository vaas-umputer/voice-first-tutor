<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice Tutor TTS Test</title>
<style>
  body { font-family: monospace; padding: 1rem; }
  #log { border: 1px solid #ccc; padding: 0.5rem; height: 300px; overflow-y: auto; white-space: pre-wrap; background: #f9f9f9; }
  button { margin: 0.25rem; padding: 0.4rem 0.8rem; }
  #status { font-weight: bold; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div id="status">Disconnected</div>
<button id="btn-connect">Connect</button>
<button id="btn-send">Load &amp; Send Audio</button>
<button id="btn-barge">Barge In</button>
<button id="btn-terminate">Terminate</button>
<div id="log"></div>

<script>
  const WS_URL = 'ws://localhost:8000/ws/session';
  const AUDIO_PATH = 'sample1.wav';
  const CHUNK_SIZE = 4096;
  const CHUNK_DELAY_MS = 50;

  let ws = null;

  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');

  function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function connect() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    ws = new WebSocket(WS_URL);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      setStatus('Connected');
      log('[connected]');
    };

    ws.onclose = () => {
      setStatus('Disconnected');
      log('[disconnected]');
    };

    ws.onerror = (e) => {
      log('[ws error] ' + e.type);
    };

    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch {
          log('[raw] ' + event.data);
          return;
        }
        log('[' + (msg.type || 'unknown') + '] ' + JSON.stringify(msg));
        if (msg.type === 'tutor_turn' && msg.text) {
          const utt = new SpeechSynthesisUtterance(msg.text);
          speechSynthesis.speak(utt);
        }
      }
    };
  }

  async function sendAudio() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      log('[error] not connected');
      return;
    }
    speechSynthesis.cancel();

    let arrayBuffer;
    try {
      const response = await fetch(AUDIO_PATH);
      arrayBuffer = await response.arrayBuffer();
    } catch (e) {
      log('[error] failed to fetch audio: ' + e.message);
      return;
    }

    log('[sending] ' + arrayBuffer.byteLength + ' bytes in ' + CHUNK_SIZE + '-byte chunks');

    let offset = 0;
    while (offset < arrayBuffer.byteLength) {
      if (ws.readyState !== WebSocket.OPEN) break;
      const chunk = arrayBuffer.slice(offset, offset + CHUNK_SIZE);
      ws.send(chunk);
      offset += CHUNK_SIZE;
      await new Promise(r => setTimeout(r, CHUNK_DELAY_MS));
    }
    log('[done sending audio]');
  }

  function bargeIn() {
    speechSynthesis.cancel();
    log('[barge in] TTS cancelled');
  }

  function terminate() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      log('[error] not connected');
      return;
    }
    ws.send(JSON.stringify({ type: 'terminate' }));
    log('[sent terminate]');
  }

  document.getElementById('btn-connect').addEventListener('click', connect);
  document.getElementById('btn-send').addEventListener('click', sendAudio);
  document.getElementById('btn-barge').addEventListener('click', bargeIn);
  document.getElementById('btn-terminate').addEventListener('click', terminate);

  connect();
</script>
</body>
</html>
